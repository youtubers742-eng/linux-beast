          rm -f nexora_app.py nexora_ui.html
          python - <<'PY'
          import base64, gzip, sys
          try:
              raw = base64.b64decode("".join(open("nx.b64").read().split()))
              a, u = raw.split(b"||NX||")
              open("nexora_app.py", "wb").write(gzip.decompress(a))
              open("nexora_ui.html", "wb").write(gzip.decompress(u))
              print("files written OK")
          except Exception as e:
              print("DECODE FAIL (file adhoora hai):", e)
              print("Fix: nexora.yml ko PASTE nahi, UPLOAD karo")
