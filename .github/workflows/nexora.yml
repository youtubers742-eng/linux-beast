      - name: '[9/9] NEXORA chalu karo + public link'
        shell: bash
        run: |
          cd "$NX_ROOT"

          # ---------- PASSWORD ----------
          # khali chhod do = koi password nahi (direct khulega)
          # 'auto' likho  = khud 10 char ka password banayega
          # kuch bhi likho = wahi password lagega
          if [ -z "$NEXORA_PASSWORD" ]; then
            NEXORA_PASSWORD="off"
          fi
          if [ "$NEXORA_PASSWORD" = "auto" ]; then
            NEXORA_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 10)
          fi
          echo "$NEXORA_PASSWORD" > .nxpass
          export NEXORA_PASSWORD
          if [ "$NEXORA_PASSWORD" = "off" ]; then
            echo "password: OFF (koi lock nahi - direct khulega)"
          else
            echo "password ready (${#NEXORA_PASSWORD} char)"
          fi

          NEXORA_PORT=8000 NEXORA_PASSWORD="$NEXORA_PASSWORD" nohup python nexora_app.py --port 8000 > server.log 2>&1 &
          sleep 14
          NXPW="$NEXORA_PASSWORD"
          if [ -f PASSWORD.txt ]; then
            NXPW=$(sed -n 's/.*PASSWORD: *//p' PASSWORD.txt | head -1 | tr -d '\r')
            [ -z "$NXPW" ] && NXPW="$NEXORA_PASSWORD"
          fi
          curl -s --max-time 10 http://127.0.0.1:8000/api/health > /dev/null 2>&1 || echo "(health fail - chalega)"
          echo ""

          U=""
          ROUND=0
          while [ -z "$U" ] && [ $ROUND -lt 6 ]; do
            ROUND=$((ROUND+1))
            echo "=== koshish $ROUND : public link dhoondh rahe hain ==="

            # ---- 1) Cloudflare (best + shareable) ----
            if [ -z "$U" ]; then
              curl -sL --max-time 150 -o cf.exe https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe > /dev/null 2>&1 || true
              if [ -s cf.exe ] 2>/dev/null; then
                pkill -f cloudflared 2>/dev/null || true
                pkill -f cf.exe 2>/dev/null || true
                sleep 1
                rm -f cf.log
                nohup ./cf.exe tunnel --url http://localhost:8000 --no-autoupdate --protocol http2 > cf.log 2>&1 &
                sleep 5
                if [ -z "$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log 2>/dev/null | head -1)" ]; then
                  nohup ./cf.exe tunnel --url http://127.0.0.1:8000 --no-autoupdate --protocol http2 > cf2.log 2>&1 &
                  sleep 6
                  if [ -s cf2.log ]; then cat cf2.log >> cf.log 2>/dev/null || true; fi
                fi
                for i in $(seq 1 25); do
                  U=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log 2>/dev/null | head -1 || true)
                  if [ -n "$U" ]; then break; fi
                  sleep 3
                done
                if [ -n "$U" ]; then echo "  [OK] Cloudflare"; fi
              fi
            fi

            # ---- 2) localhost.run (ssh) ----
            if [ -z "$U" ]; then
              nohup ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -R 80:localhost:8000 nokey@localhost.run > lr.log 2>&1 &
              for i in $(seq 1 20); do
                U=$(grep -oE 'https://[a-z0-9]+\.lhr\.life' lr.log 2>/dev/null | head -1 || true)
                if [ -n "$U" ]; then break; fi
                sleep 3
              done
              if [ -n "$U" ]; then echo "  [OK] localhost.run"; fi
            fi

            # ---- 3) pinggy (ssh) ----
            if [ -z "$U" ]; then
              nohup ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -p 443 -R0:localhost:8000 a.pinggy.io > pg.log 2>&1 &
              for i in $(seq 1 20); do
                U=$(grep -oE 'https://[a-zA-Z0-9-]+\.a\.free\.pinggy\.link' pg.log 2>/dev/null | head -1 || true)
                if [ -n "$U" ]; then break; fi
                sleep 3
              done
              if [ -n "$U" ]; then echo "  [OK] pinggy"; fi
            fi

            # ---- 4) localtunnel (node) ----
            if [ -z "$U" ]; then
              nohup npx --yes localtunnel --port 8000 > lt.log 2>&1 &
              for i in $(seq 1 30); do
                U=$(grep -oE 'https://[a-z0-9-]+\.loca\.lt' lt.log 2>/dev/null | head -1 || true)
                if [ -n "$U" ]; then break; fi
                sleep 3
              done
              if [ -n "$U" ]; then echo "  [OK] localtunnel"; fi
            fi

            if [ -z "$U" ]; then
              echo "  koshish $ROUND fail - 30 sec baad dobara..."
              echo "  --- diagnostics ---"
              if [ -s cf.log ]; then echo "  cloudflared: $(tail -c 220 cf.log | tr '\n' ' ')"; fi
              echo "  server: $(curl -s --max-time 6 -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health 2>/dev/null || echo dead)"
              echo "  -------------------"
              sleep 30
            fi
          done

          # ---- LINK TURANT PRINT (kuch bhi ho) ----
          if [ -n "$U" ]; then
            echo ""
            echo "######################################################################"
            echo "#                                                                    #"
            echo "#   >> YEH LINK APNI PC / PHONE KE BROWSER MEIN KHOL <<              #"
            echo "#                                                                    #"
            echo "#            $U"
            echo "#                                                                    #"
            if [ "${NXPW:-$NEXORA_PASSWORD}" = "off" ]; then
              echo "#   PASSWORD  : koi nahi - direct khulega                                #"
            else
              echo "#   PASSWORD  : ${NXPW:-$NEXORA_PASSWORD}                                          #"
            fi
            echo "#                                                                    #"
            echo "#   Share bhi kar sakte ho. Koi app / download nahi chahiye.         #"
            echo "######################################################################"
            echo ""
          fi

          # ---- backup: tailscale IP (kabhi fail na ho) ----
          IP=""
          if [ -f ts_ip.txt ]; then IP=$(cat ts_ip.txt 2>/dev/null || true); fi
          if [ -z "$IP" ]; then
            TSX="/c/Program Files/Tailscale/tailscale.exe"
            if [ -f "$TSX" ]; then IP=$("$TSX" ip -4 2>/dev/null || true); fi
          fi
          KIP=""
          if [ -f data/kaggle_ip.txt ]; then KIP=$(cat data/kaggle_ip.txt 2>/dev/null || true); fi

          echo ""
          echo ""
          echo "######################################################################"
          echo "#                                                                    #"
          echo "#      P C   T A I Y A A R   H A I   -   N E X O R A                #"
          echo "#                                                                    #"
          echo "######################################################################"
          echo "#                                                                    #"
          if [ -n "$U" ]; then
            echo "#   LINK     >>  $U"
          else
            echo "#   LINK     >>  nahi bana (4 tareeke, 6 baar try kiye)"
            echo "#"
            echo "#   AB KYA KAREIN:                                                 #"
            echo "#     * Ye step chalega hi rehga - link milte hi yahan print hoga    #"
            echo "#     * Niche 'diagnostics' dekho - server zinda hai ya nahi          #"
            echo "#     * Dropdown se dobara Run workflow dabao (naya IP milega)         #"
          fi
          echo "#                                                                    #"
          if [ "${NXPW:-$NEXORA_PASSWORD}" = "off" ]; then
            echo "#   PASSWORD >>  koi nahi - direct khulega                              #"
          else
            echo "#   PASSWORD >>  ${NXPW:-$NEXORA_PASSWORD}"
          fi
          echo "#                                                                    #"
          echo "#--------------------------------------------------------------------#"
          echo "#   Kaise chalayein:                                                 #"
          echo "#     1. Upar wala LINK browser mein kholo (PC ya phone)             #"
          if [ "${NXPW:-$NEXORA_PASSWORD}" = "off" ]; then
            echo "#     2. Bas - NEXORA seedha chal gaya                                  #"
          else
            echo "#     2. Password box mein upar wala PASSWORD daalo                  #"
            echo "#     3. Bas - NEXORA chal gaya                                      #"
          fi
          echo "#--------------------------------------------------------------------#"
          if [ -n "$IP" ]; then
            echo "#   Backup   : http://$IP:8000   (Tailscale)                        #"
          fi
          echo "#   GPU brain : ${KIP:-off}                                                     "
          echo "#   Dots      : ATLAS, SCOUT, SCRIBE, CODA, PILOT                    #"
          echo "#   Model     : upar MODEL SLIDER se badlo (Fast/Power/Kaggle GPU)   #"
          echo "#   Band hoga : ${NX_HOURS:-5} ghante mein, ya Cancel run karo                           #"
          echo "######################################################################"
          echo ""

          # ---------------- heartbeat ----------------
          H=${NX_HOURS:-5}
          END=$((SECONDS+H*3600))
          TICK=0
          while [ $SECONDS -lt $END ]; do
            sleep 60
            TICK=$((TICK+1))
            curl -s --max-time 8 http://127.0.0.1:8000/api/health > /dev/null 2>&1
            RC=$?
            if [ $RC -ne 0 ]; then
              echo "$(date +%H:%M:%S) server gir gaya - restart"
              NEXORA_PORT=8000 nohup python nexora_app.py --port 8000 >> server.log 2>&1 &
              sleep 10
            fi
            if [ $((TICK % 5)) -eq 0 ]; then
              LEFT=$(( (END-SECONDS)/60 ))
              echo "-----------------------------------------------"
              echo "$(date +%H:%M:%S)  NEXORA zinda hai - ${LEFT} min bache"
              echo "LINK: ${U:-http://${IP:-localhost}:8000}   PASSWORD: ${NXPW:-$NEXORA_PASSWORD}"
              echo "     (password OFF hai to seedha khulega)"
              echo "-----------------------------------------------"
            fi
          done
          echo "Time khatam. Cancel run kar ke dobara Run workflow dabao."

